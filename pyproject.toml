[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptotradingagents"
version = "0.1.0"
description = "CryptoTradingAgents: Multi-Agents LLM Crypto Trading Framework powered by Nansen On-Chain Analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
    "ta-lib>=0.4.28",
    "numpy>=1.24.0",
    "ccxt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
cryptoagents = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cryptoagents*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results", "worklog"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]
